# Pipeline configuration.
# Edit here, not in the code.
#
# countries      - ISO2 codes. email_allowed=false blocks the email channel for
#                  that country: cold B2B email has no valid legal basis there,
#                  so the pipeline refuses to emit a lead on that channel.
# categories     - "fit" is how likely that business type is to buy a website,
#                  0-20. A category with fit 0 never becomes a lead.
# tiers          - score cut-offs. A is the top of the queue.
# cities         - pilot areas. bbox = [xmin, ymin, xmax, ymax].
overture:
  release: 2026-09-23.1
  bucket: s3://overturemaps-us-west-2/release/{release}/theme=places/type=place/*.parquet
